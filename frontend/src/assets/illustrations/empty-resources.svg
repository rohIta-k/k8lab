<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Connection Paths (Subtle Dotted Lines) -->
  <path d="M100 150 Q150 120 200 150" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>
  <path d="M200 150 Q250 180 300 150" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>
  <path d="M200 150 L200 220" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>
  
  <!-- Deployment Box (Top Left) -->
  <g transform="translate(60, 120)">
    <rect width="80" height="60" rx="8" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-width="2"/>
    <rect x="15" y="15" width="20" height="4" rx="2" fill="#3B82F6"/>
    <rect x="15" y="25" width="50" height="4" rx="2" fill="#64748B" fill-opacity="0.4"/>
    <rect x="15" y="35" width="40" height="4" rx="2" fill="#64748B" fill-opacity="0.4"/>
  </g>
  
  <!-- Pod Cube (Center) -->
  <g transform="translate(170, 120)">
    <path d="M30 0 L60 15 V45 L30 60 L0 45 V15 L30 0Z" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="2"/>
    <path d="M30 0 V30 L60 45 M30 30 L0 45" stroke="#3B82F6" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Service Node (Right) -->
  <g transform="translate(280, 130)">
    <circle cx="30" cy="30" r="30" fill="#3B82F6" fill-opacity="0.05" stroke="#3B82F6" stroke-width="2" stroke-dasharray="2 2"/>
    <rect x="20" y="20" width="20" height="20" rx="4" fill="#3B82F6"/>
  </g>

  <!-- Floating Elements -->
  <circle cx="220" cy="80" r="4" fill="#64748B" opacity="0.4"/>
  <circle cx="100" cy="220" r="3" fill="#3B82F6" opacity="0.6"/>
  <rect x="320" y="90" width="8" height="8" rx="2" transform="rotate(45 320 90)" fill="#64748B" opacity="0.3"/>
</svg>